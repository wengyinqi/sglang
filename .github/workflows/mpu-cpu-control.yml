name: MPU CPU acceptance

on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPU_CPU_CONTROL_EVIDENCE: ${{ github.workspace }}/cpu-evidence/processes
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest==9.1.1 numpy==2.3.3 requests==2.32.5
      - name: Portable and real Gloo acceptance (no GPU)
        run: python benchmark/mpu_stages/acceptance.py --through portable --output-dir cpu-evidence/acceptance --execute
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-acceptance-${{ github.sha }}
          path: cpu-evidence/
